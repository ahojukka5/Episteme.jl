name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '37 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull-request update makes an in-flight run obsolete. Cancel
# it instead of letting it run to completion: these jobs land on a shared
# self-hosted fleet, so a superseded run is holding a slot that current work
# is queueing for. Grouped per workflow, so unrelated workflows in this
# repository never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "test: suite (Julia ${{ matrix.julia-version }})"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
    # Delone is private. The lifecycle project clones it by URL and SHA.
    # Pkg reads the credential helper this step installs, including the
    # child process that instantiates that project.
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub credentials for private dependencies
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret PRIVATE_REPOS_TOKEN is not set; private dependencies cannot be cloned"
            exit 1
          fi
          gh auth setup-git

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Restore Julia dependencies
        uses: julia-actions/cache@v2

      - name: Run package tests
        uses: julia-actions/julia-runtest@v1
