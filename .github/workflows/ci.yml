name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '37 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull-request update makes an in-flight run obsolete. Cancel
# it instead of letting it run to completion: superseded checks waste
# GitHub-hosted capacity. The group is workflow-scoped so different
# workflows cannot cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "test: suite (Julia ${{ matrix.julia-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Restore Julia dependencies
        uses: julia-actions/cache@v2

      - name: Run package tests
        uses: julia-actions/julia-runtest@v1
